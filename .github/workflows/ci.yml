name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Acceptance tests (one or more per backlog story)
        run: pytest -q
      - name: Definition of Done - every Done story has a test
        run: python tools/trace.py
      - name: Sample readiness pack builds
        run: ai-act-readiness report --portfolio data/sample/portfolio.json --evidence data/sample/evidence.csv --literacy data/sample/literacy.csv --as-of 2026-11-04 --out out
      - name: Scrub for material that must not be public
        run: python tools/scrub_check.py .
