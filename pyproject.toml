[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-act-readiness"
version = "0.1.0"
description = "AI Act readiness for an AI use-case portfolio: classification proposals, obligations, evidence gaps and the decisions an executive committee owns"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Flavio Mericio" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ai-act-readiness = "ai_act_readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_act_readiness = ["rules.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
